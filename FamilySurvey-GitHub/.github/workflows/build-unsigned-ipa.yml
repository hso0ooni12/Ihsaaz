name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iPhone IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app without code signing
        run: |
          set -euo pipefail

          xcodebuild \
            -project FamilySurvey.xcodeproj \
            -scheme FamilySurvey \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify app is unsigned
        run: |
          set -euo pipefail

          APP_PATH="build/Build/Products/Release-iphoneos/FamilySurvey.app"
          test -d "$APP_PATH"

          if /usr/bin/codesign -dv --verbose=2 "$APP_PATH" >/tmp/codesign.txt 2>&1; then
            echo "ERROR: The .app unexpectedly contains a code signature."
            cat /tmp/codesign.txt
            exit 1
          else
            echo "Verified: the generated .app is unsigned."
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="build/Build/Products/Release-iphoneos/FamilySurvey.app"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # A provisioning profile is not expected in an unsigned build.
          rm -f Payload/FamilySurvey.app/embedded.mobileprovision

          /usr/bin/zip -qry FamilySurvey-unsigned.ipa Payload

          echo "SHA-256:"
          shasum -a 256 FamilySurvey-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: FamilySurvey-unsigned-ipa
          path: FamilySurvey-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
